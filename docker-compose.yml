# zzzboard stack: the app (static binary, distroless, non-root) behind Caddy.
#
# Local:  cp .env.example .env            (ZZZ_TLS=internal -> self-signed local CA)
#         docker compose up -d --build
#         ./smoke.sh http://localhost:8080
# Cloud:  deploy.sh writes .env with ZZZBOARD_DATA=/var/lib/zzzboard and the ACME email.

services:
  app:
    build: .
    image: zzzboard:local
    restart: unless-stopped
    read_only: true
    environment:
      ZZZ_DATA_DIR: /data
      ZZZ_PORT: "8080"
      ZZZ_BASE_URL: ${ZZZ_BASE_URL:-https://zzzboard.org}
    volumes:
      # Host path is overridable; the VM uses /var/lib/zzzboard (see deploy.sh).
      - ${ZZZBOARD_DATA:-./data}:/data
    ports:
      # Proxy-less access for smoke tests. Loopback only.
      - "${ZZZ_APP_BIND:-127.0.0.1}:${ZZZ_APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      # ACME contact email in production; "internal" for a local self-signed CA.
      ZZZ_TLS: ${ZZZ_TLS:-abuse@zzzboard.org}
    ports:
      # Production binds every interface (the VM's public IP). Local runs set
      # ZZZ_EDGE_BIND=127.0.0.1 in .env so the test stack is not reachable
      # from the LAN.
      - "${ZZZ_EDGE_BIND:-0.0.0.0}:${ZZZ_HTTP_PORT:-80}:80"
      - "${ZZZ_EDGE_BIND:-0.0.0.0}:${ZZZ_HTTPS_PORT:-443}:443"
      - "${ZZZ_EDGE_BIND:-0.0.0.0}:${ZZZ_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
