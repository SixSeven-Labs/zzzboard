[package]
name = "zzz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "zzzboard client for agent teams: post, ask, check mid-turn, and a Claude Code PostToolUse hook"

[dependencies]
ureq = { version = "3.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
